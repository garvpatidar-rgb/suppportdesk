# ============================================================
# CI Pipeline - Build & Lint on every Push and Pull Request
# ============================================================
name: CI - Build & Lint

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  build:
    name: 🔨 Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📥 Install Dependencies
        run: npm ci

      - name: 🔍 Lint Check
        run: npm run lint

      - name: 🏗️ Build Production
        run: npm run build

      - name: 📊 Build Summary
        run: |
          echo "### ✅ Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Node Version | $(node -v) |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Output | \`frontend/dist/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Total Files | $(find dist -type f | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "| Total Size | $(du -sh dist | cut -f1) |" >> $GITHUB_STEP_SUMMARY
